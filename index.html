<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>安溥的數字藏館 · Anpu's Digital Archive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 頁面切換遮罩 -->
  <div id="trans-wipe" class="trans-wipe"></div>

  <!-- ==================== Stage 1: 首頁 ==================== -->
  <section id="home-stage" class="stage stage-active">
    <!-- 最終成品頁面背景：直接鋪滿，請勿重構 -->
    <div class="page-bg" id="home-bg" style="background-image: url('images/home-bg.jpg');"></div>
    <!-- 熱區：Anpu's Digital Archive 花體英文區域 -->
    <a href="javascript:void(0)" id="home-hotzone" class="hotzone home-hotzone" title="進入"></a>
    <!-- 明顯可見的進入按鈕 + 提示動畫 -->
    <button id="home-enter-btn" class="page-enter-btn home-enter-btn" type="button" aria-label="進入">
      <span class="enter-text">ENTER</span>
      <span class="enter-arrow" aria-hidden="true">↓</span>
    </button>
    <div class="page-hint" id="home-hint">TAP TO ENTER · 點擊進入</div>
  </section>

  <!-- ==================== Stage 2: 過渡頁 ==================== -->
  <section id="welcome-stage" class="stage">
    <!-- 最終成品頁面背景：直接鋪滿，請勿重構 -->
    <div class="page-bg" id="welcome-bg" style="background-image: url('images/welcome-bg.jpg');"></div>
    <!-- 熱區：右下角「進館」文字位置 -->
    <a href="javascript:void(0)" id="enter-hotzone" class="hotzone welcome-hotzone" title="進入藏館"></a>
    <!-- 明顯可見的進館按鈕 -->
    <button id="welcome-enter-btn" class="page-enter-btn welcome-enter-btn" type="button" aria-label="進入藏館">
      <span class="enter-text">進 入 藏 館</span>
      <span class="enter-arrow" aria-hidden="true">→</span>
    </button>
    <div class="page-hint" id="welcome-hint">TAP TO ENTER · 點擊進入</div>
  </section>

  <!-- ==================== Stage 3: 球覽 (3D 球體) ==================== -->
  <section id="globe-stage" class="stage">
    <div id="globe-container"></div>
    <div id="globe-hint">
      <span>拖曳旋轉</span>
      <span class="dot">·</span>
      <span>點擊查看</span>
    </div>
    <div class="globe-mode-toggle">
      <button class="mode-btn is-active" data-mode="globe" type="button">球覽</button>
      <button class="mode-btn" data-mode="tile" type="button">平鋪</button>
    </div>
    <button class="back-btn" id="globe-back" aria-label="返回">←</button>
  </section>

  <!-- ==================== Stage 4: 平鋪 (媒體滑動區) ==================== -->
  <section id="media-stage" class="stage">
    <header class="media-header">
      <div class="media-title-wrap">
        <h1 class="media-title">球覽 / 平鋪</h1>
        <p class="media-subtitle">媒體報導與品牌合作</p>
      </div>
      <div class="media-mode-toggle">
        <button class="mode-btn" data-mode="globe" type="button">球覽</button>
        <button class="mode-btn is-active" data-mode="tile" type="button">平鋪</button>
      </div>
      <div class="media-toggle">
        <button class="media-toggle-btn is-active" data-mode="view" type="button">瀏覽</button>
        <button class="media-toggle-btn" data-mode="manage" type="button">管理</button>
      </div>
    </header>

    <div class="media-slider-container">
      <div class="media-slider" id="media-slider">
        <!-- 卡片由 JS 動態生成 -->
      </div>
    </div>

    <!-- 管理工具列：上傳 / 新增 -->
    <div class="media-toolbar" id="media-toolbar" hidden>
      <label class="media-upload-btn" for="media-file-input">
        <span>＋ 上傳媒體</span>
        <input id="media-file-input" type="file" accept="image/*" multiple hidden>
      </label>
      <button class="media-add-text-btn" id="media-add-text-btn" type="button">＋ 新增純文字條目</button>
    </div>

    <button class="back-btn" id="media-back" aria-label="返回">←</button>
  </section>

  <!-- ==================== 媒體：編輯標題/內容對話框 ==================== -->
  <div class="media-edit-modal" id="media-edit-modal" aria-hidden="true">
    <div class="media-edit-card">
      <h3 id="media-edit-title">編輯條目</h3>
      <input class="media-edit-input" id="media-edit-title-input" type="text" placeholder="標題" maxlength="60">
      <textarea class="media-edit-textarea" id="media-edit-text-input" placeholder="純文字內容（純文字條目用，圖片條目可留空）" maxlength="500"></textarea>
      <textarea class="media-edit-textarea" id="media-edit-description-input" placeholder="簡介（圖片條目用，純文字條目可留空；最多 200 字）" maxlength="200"></textarea>
      <div class="media-edit-audio">
        <label class="media-edit-audio-label" for="media-edit-audio-input">
          <span class="media-edit-audio-icon">🎙</span>
          <span class="media-edit-audio-text">上傳語音 / 錄音</span>
          <span class="media-edit-audio-name" id="media-edit-audio-name">（未選擇）</span>
        </label>
        <input id="media-edit-audio-input" type="file" accept="audio/*" hidden>
        <button class="media-edit-audio-clear" id="media-edit-audio-clear" type="button" hidden>清除</button>
      </div>
      <div class="media-edit-actions">
        <button class="media-edit-cancel" id="media-edit-cancel" type="button">取消</button>
        <button class="media-edit-confirm" id="media-edit-confirm" type="button">儲存</button>
      </div>
    </div>
  </div>

  <!-- ==================== 媒體：詳情面板（球覽模式點擊開啟） ==================== -->
  <div class="media-detail-modal" id="media-detail-modal" aria-hidden="true">
    <div class="media-detail-card">
      <button class="media-detail-close" id="media-detail-close" type="button" aria-label="關閉">×</button>
      <div class="media-detail-image-wrap" id="media-detail-image-wrap">
        <img id="media-detail-img" src="" alt="" draggable="false">
      </div>
      <div class="media-detail-body">
        <h3 id="media-detail-title" class="media-detail-title">—</h3>
        <p id="media-detail-text" class="media-detail-text"></p>
        <p id="media-detail-description" class="media-detail-description"></p>
        <div class="media-detail-audio-wrap" id="media-detail-audio-wrap" hidden>
          <audio id="media-detail-audio" controls preload="metadata"></audio>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 媒體：刪除確認對話框 ==================== -->
  <div class="media-confirm-modal" id="media-confirm-modal" aria-hidden="true">
    <div class="media-confirm-card">
      <p id="media-confirm-text">確定要刪除這個媒體條目嗎？</p>
      <div class="media-confirm-actions">
        <button class="media-confirm-cancel" id="media-confirm-cancel" type="button">取消</button>
        <button class="media-confirm-delete" id="media-confirm-delete" type="button">刪除</button>
      </div>
    </div>
  </div>

  <!-- ==================== 圖片預覽彈窗 ==================== -->
  <div id="photo-lightbox" class="photo-lightbox">
    <button class="lightbox-close" id="lightbox-close" aria-label="關閉">×</button>
    <div class="lightbox-img-wrap">
      <img id="lightbox-img-el" src="" alt="" draggable="false">
    </div>
  </div>

  <!-- Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js"
    }
  }
  </script>

  <!-- 設定 + 主程式 -->
  <script src="js/config.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
