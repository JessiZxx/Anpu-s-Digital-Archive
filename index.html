<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>安溥的數字藏館 · Anpu's Digital Archive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ 全站統一：流動點狀波紋背景層 ============ -->
  <div class="ripple-bg" aria-hidden="true"></div>

  <!-- Loading -->
  <div id="loading-indicator">
    <span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>
  </div>

  <!-- Transition wipe (頁面切換黑幕) -->
  <div id="trans-wipe" class="trans-wipe"></div>

  <!-- ==================== Stage 1: 首頁啟動頁 ==================== -->
  <div id="home-stage" class="stage stage-active">
    <div class="page-bg" id="home-bg" style="background-image: url('assets/pages/home-bg-user.jpg');"></div>
    <!-- 進館按鈕：底部中央 -->
    <button type="button" class="enter-btn" id="home-enter-btn">進館</button>
    <a href="javascript:void(0)" id="home-hotzone" class="fullscreen-hotzone" title="進入"></a>
  </div>

  <!-- ==================== Stage 2: 過渡引導頁 ==================== -->
  <div id="welcome-stage" class="stage">
    <div class="page-bg" id="welcome-bg" style="background-image: url('assets/pages/welcome-bg-user.jpg');"></div>
    <!-- 進館按鈕：右下角（對應圖 2 位置） -->
    <button type="button" class="enter-btn" id="welcome-enter-btn">進館</button>
    <a href="javascript:void(0)" id="enter-hotzone" class="fullscreen-hotzone" title="進入藏館"></a>
  </div>

  <!-- ==================== Stage 3: 核心展廳 3D 球體 ==================== -->
  <div id="globe-stage" class="stage">
    <!-- 3D 球體容器 -->
    <div id="globe-container"></div>

    <!-- 平鋪視圖容器 -->
    <div id="flat-container" class="flat-container hidden">
      <div id="flat-track" class="flat-track"></div>
    </div>

    <div id="globe-hint">
      <span>拖曳旋轉</span>
      <span class="dot">·</span>
      <span>滾輪轉動</span>
      <span class="dot">·</span>
      <span>點擊查看</span>
    </div>

    <div id="globe-tabs">
      <button class="globe-tab active" data-mode="sphere">球覽</button>
      <button class="globe-tab" data-mode="flat">平鋪</button>
    </div>
  </div>

  <!-- ==================== Detail Panel (彈窗) ==================== -->
  <!-- 照片彈窗 / 語錄彈窗通用 -->
  <div id="detail-panel" class="detail-panel">
    <div id="detail-backdrop" class="detail-backdrop"></div>
    <div class="detail-content">

      <button id="detail-close" class="detail-close" aria-label="關閉">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- 照片區（語錄卡片時此區隱藏） -->
      <div id="detail-img" class="detail-img-wrap">
        <img id="detail-img-el" src="" alt="" draggable="false">
      </div>

      <!-- 文字區 -->
      <div id="detail-content" class="detail-text">
        <div class="dp-cat">球覽</div>
        <h2 class="dp-title">標題</h2>
        <p class="dp-body"></p>
      </div>

      <!-- 音頻播放器（僅有音檔的語錄卡片顯示） -->
      <div id="detail-audio" class="detail-audio" style="display:none;">
        <button id="audio-play-btn" class="audio-play-btn" aria-label="播放錄音">
          <!-- 播放 icon -->
          <svg id="icon-play" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <!-- 暫停 icon（預設隱藏） -->
          <svg id="icon-pause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none;">
            <path d="M6 4h4v16H6zM14 4h4v16h-4z"/>
          </svg>
        </button>
        <div class="audio-progress">
          <span id="audio-cur">0:00</span>
          <input type="range" id="audio-seek" min="0" max="100" value="0" step="0.1">
          <span id="audio-total">0:00</span>
        </div>
      </div>

    </div>
  </div>

  <!-- 隱藏的音頻元素（動態設定 src） -->
  <audio id="archive-audio" preload="none"></audio>

  <footer id="site-footer">
    <p>ANPU'S DIGITAL ARCHIVE</p>
  </footer>

  <!-- ============== Scripts ============== -->
  <!-- 素材配置入口（在此檔新增照片 / 語錄 / 音檔） -->
  <script src="js/config.js"></script>

  <!-- Three.js（框架 CDN，非「爬蟲/外部資源拉取」用途） -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js"
    }
  }
  </script>

  <!-- 主程式 -->
  <script type="module" src="js/main.js?v=20260808b"></script>

  <!-- 兜底：DOM 就緒後若主模組尚未隱藏載入指示器，主動隱藏 -->
  <script>
    (function(){
      function hide(){
        var el = document.getElementById('loading-indicator');
        if(el) el.classList.add('hidden');
      }
      document.addEventListener('DOMContentLoaded', hide);
      window.addEventListener('load', hide);
      setTimeout(hide, 2500);
    })();
  </script>

</body>
</html>
