<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>安溥的數字藏館 · Anpu's Digital Archive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 統一流動點狀波紋背景 -->
  <div class="wave-bg" aria-hidden="true"></div>

  <!-- 頁面加載指示器 -->
  <div id="loading-indicator">
    <span class="loading-dot"></span>
    <span class="loading-dot"></span>
    <span class="loading-dot"></span>
  </div>

  <!-- 頁面切換遮罩 -->
  <div id="trans-wipe" class="trans-wipe"></div>

  <!-- ==================== Stage 1: 首頁 ==================== -->
  <section id="home-stage" class="stage stage-active">
    <!-- 全屏背景圖佔位：上傳 images/home-bg.jpg 替換 -->
    <div class="page-bg" id="home-bg" style="background-image: url('images/home-bg.jpg');"></div>

    <div class="home-content">
      <h1 class="home-welcome">WELCOME TO</h1>
      <p class="home-archive">Anpu's Digital Archive</p>
      <h2 class="home-title">歡迎來到安溥的數字藏館</h2>
    </div>

    <button class="enter-btn" id="home-enter" aria-label="進館">
      <span class="enter-text">進館</span>
    </button>
  </section>

  <!-- ==================== Stage 2: 過渡頁 ==================== -->
  <section id="welcome-stage" class="stage">
    <!-- 全屏背景圖佔位：上傳 images/welcome-bg.jpg 替換 -->
    <div class="page-bg" id="welcome-bg" style="background-image: url('images/welcome-bg.jpg');"></div>

    <div class="welcome-content">
      <div class="welcome-text">
        <p class="handwriting">愛我。一次兩遍。</p>
        <p class="handwriting signature">安溥。</p>
      </div>
      <!-- 人像圖佔位：上傳 images/welcome-portrait.png 替換 -->
      <div class="portrait-wrap">
        <img id="welcome-portrait" src="images/welcome-portrait.png" alt="">
      </div>
    </div>

    <button class="enter-btn" id="welcome-enter" aria-label="進館">
      <span class="enter-text">進館</span>
    </button>
  </section>

  <!-- ==================== Stage 3: 3D 球體展廳 ==================== -->
  <section id="globe-stage" class="stage">
    <div id="globe-container"></div>

    <div id="globe-hint">
      <span>拖曳旋轉</span>
      <span class="dot">·</span>
      <span>點擊查看</span>
    </div>

    <button class="back-btn" id="globe-back" aria-label="返回">←</button>
  </section>

  <!-- ==================== 圖片預覽彈窗 ==================== -->
  <div id="photo-lightbox" class="photo-lightbox">
    <button class="lightbox-close" id="lightbox-close" aria-label="關閉">×</button>
    <div class="lightbox-img-wrap">
      <img id="lightbox-img-el" src="" alt="" draggable="false">
    </div>
  </div>

  <!-- Three.js -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.157.0/build/three.module.js"
    }
  }
  </script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
